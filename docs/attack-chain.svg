<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Animated anatomy of a contained MCP breakout: mcp-server spawns python3, which spawns /bin/sh, which runs curl against the cloud metadata service; the cgroup is quarantined and the kernel returns EPERM">
  <title>Anatomy of a contained MCP breakout</title>
  <desc>A five-stage prompt-injection attack chain is detected by the rule engine and quarantined at the cgroup level, so the kernel denies the metadata request before it completes.</desc>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="100%" stop-color="#0b0a14"/>
    </linearGradient>
    <radialGradient id="danger" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chainLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <marker id="cArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
    <filter id="cGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h { font-size: 12.5px; font-weight: 800; letter-spacing: 3.2px; fill: #e2e8f0; }
      .hs { font-size: 11px; fill: #64748b; }
      .nt { font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .nd { font-size: 10.5px; fill: #8b9bb4; }
      .tag { font-size: 9.5px; font-weight: 700; letter-spacing: .6px; }
      .stamp { font-size: 12.5px; font-weight: 800; letter-spacing: 1.6px; }
      .n1, .n2, .n3, .n4, .n5, .a1, .a2, .a3, .a4, .st, .permission { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-out; opacity: 0; }
      .n1 { animation-name: k1; } .n2 { animation-name: k2; } .n3 { animation-name: k3; }
      .n4 { animation-name: k4; } .n5 { animation-name: k5; }
      .a1 { animation-name: k1; } .a2 { animation-name: k2; }
      .a3 { animation-name: k3; } .a4 { animation-name: k4; }
      .st { animation-name: kStamp; } .permission { animation-name: kPerm; }
      #pulseA, #pulseB { animation: travel 3.2s linear infinite; }
      @keyframes k1 { 0% { opacity: 0; } 2%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes k2 { 0%, 6% { opacity: 0; } 9%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes k3 { 0%, 12% { opacity: 0; } 15%, 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes k4 { 0%, 18% { opacity: 0; } 21%, 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes k5 { 0%, 24% { opacity: 0; } 27%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes kStamp { 0%, 38% { opacity: 0; transform: scale(.96); } 42%, 97% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
      @keyframes kPerm { 0%, 44% { opacity: 0; } 47%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(1000px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .n1,.n2,.n3,.n4,.n5,.a1,.a2,.a3,.a4,.st,.permission { opacity: 1; } }
    ]]></style>
  </defs>

  <rect width="1280" height="340" fill="url(#cbg)"/>
  <ellipse cx="1100" cy="60" rx="320" ry="150" fill="url(#danger)"/>

  <!-- header -->
  <text x="48" y="42" class="sans h">ANATOMY OF A CONTAINED MCP BREAKOUT</text>
  <text x="48" y="62" class="mono hs">prompt injection → shell → metadata theft · detected in &lt; 20 µs · cgroup quarantined in 2.2 ms</text>

  <!-- chain -->
  <path d="M48 122 H 1206" stroke="#132033" stroke-width="2"/>
  <path d="M48 122 H 1206" stroke="url(#chainLine)" stroke-width="2" stroke-dasharray="1 0" opacity="0.25"/>
  <circle id="pulseA" cx="60" cy="122" r="4" fill="#f87171" filter="url(#cGlow)"/>
  <circle id="pulseB" cx="60" cy="122" r="3" fill="#fbbf24" filter="url(#cGlow)"/>

  <!-- node 1 -->
  <g class="n1">
    <rect x="48" y="90" width="190" height="64" rx="10" fill="#0b1424" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="64" y="114" class="mono nt">mcp-server</text>
    <text x="64" y="132" class="mono nd">pid 10101 · cgroup 0xA001</text>
    <text x="64" y="146" class="mono tag" fill="#67e8f9">EXECVE · AI RUNTIME</text>
  </g>
  <!-- node 2 -->
  <g class="n2">
    <rect x="290" y="90" width="190" height="64" rx="10" fill="#0b1424" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="306" y="114" class="mono nt">python3</text>
    <text x="306" y="132" class="mono nd">pid 10102 · tool call</text>
    <text x="306" y="146" class="mono tag" fill="#7dd3fc">EXECVE · MCP TOOL</text>
  </g>
  <!-- node 3 -->
  <g class="n3">
    <rect x="532" y="90" width="190" height="64" rx="10" fill="#170f14" stroke="#f59e0b" stroke-opacity="0.75"/>
    <text x="548" y="114" class="mono nt">/bin/sh</text>
    <text x="548" y="132" class="mono nd">pid 10103 · shell</text>
    <text x="548" y="146" class="mono tag" fill="#fbbf24">MCP_SHELL_BREAKOUT</text>
  </g>
  <!-- node 4 -->
  <g class="n4">
    <rect x="774" y="90" width="190" height="64" rx="10" fill="#170f14" stroke="#fb7185" stroke-opacity="0.8"/>
    <text x="790" y="114" class="mono nt">curl</text>
    <text x="790" y="132" class="mono nd">pid 10203 · exfil</text>
    <text x="790" y="146" class="mono tag" fill="#fb7185">MCP_RECON_OR_EXFIL</text>
  </g>
  <!-- node 5 -->
  <g class="n5">
    <rect x="1016" y="90" width="190" height="64" rx="10" fill="#1a0d12" stroke="#ef4444" stroke-opacity="0.9"/>
    <text x="1032" y="114" class="mono nt">169.254.169.254</text>
    <text x="1032" y="132" class="mono nd">:80 · IMDS</text>
    <text x="1032" y="146" class="mono tag" fill="#f87171">CLOUD_IMDS_THEFT</text>
  </g>

  <!-- connectors -->
  <g class="a1"><path d="M246 122 H 282" stroke="#f87171" stroke-width="2" marker-end="url(#cArrow)"/></g>
  <g class="a2"><path d="M488 122 H 524" stroke="#f87171" stroke-width="2" marker-end="url(#cArrow)"/></g>
  <g class="a3"><path d="M730 122 H 766" stroke="#f87171" stroke-width="2" marker-end="url(#cArrow)"/></g>
  <g class="a4"><path d="M972 122 H 1008" stroke="#f87171" stroke-width="2" marker-end="url(#cArrow)"/></g>

  <!-- containment -->
  <g class="st">
    <rect x="48" y="196" width="900" height="58" rx="12" fill="#140a12" stroke="#ef4444" stroke-opacity="0.65"/>
    <text x="70" y="220" class="mono stamp" fill="#fca5a5">QUARANTINE_CGROUP(0xA001) · BLOCK_IPV4(169.254.169.254)</text>
    <text x="70" y="240" class="mono nd">wire_policy_cmd_t 32 B → bpf_map_update_elem() → every task in the cgroup is now denied</text>
    <text x="928" y="220" class="mono" font-size="11" fill="#8b9bb4" text-anchor="end">policy round-trip</text>
    <text x="928" y="238" class="mono" font-size="11" fill="#f87171" font-weight="700" text-anchor="end">2.2 ms</text>
  </g>
  <g class="permission">
    <rect x="964" y="196" width="242" height="58" rx="12" fill="#1a0d12" stroke="#ef4444" stroke-opacity="0.6"/>
    <text x="986" y="222" class="mono stamp" fill="#fecaca">LSM → -EPERM</text>
    <text x="986" y="240" class="mono nd">syscall never completes</text>
  </g>

  <!-- legend -->
  <g class="mono" opacity="0.9">
    <circle cx="56" cy="292" r="4" fill="#22d3ee"/><text x="68" y="296" class="nd">observed</text>
    <circle cx="160" cy="292" r="4" fill="#f59e0b"/><text x="172" y="296" class="nd">rule fired</text>
    <circle cx="280" cy="292" r="4" fill="#ef4444"/><text x="292" y="296" class="nd">denied in kernel</text>
    <text x="1016" y="296" class="nd" text-anchor="end">same five steps are verified end-to-end by tests/simulate_mcp_attack.py</text>
  </g>
</svg>
