<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="Detection coverage matrix: ten attacker techniques against the six shipped rules, marking which techniques are detected and enforced, which are detected only after the fact, and four documented gaps">
  <title>Detection coverage matrix</title>
  <desc>Each row is an attacker technique observed at the syscall layer; each column is a shipped rule. Filled cells detect and enforce, ringed cells detect after the fact, empty cells are documented gaps.</desc>
