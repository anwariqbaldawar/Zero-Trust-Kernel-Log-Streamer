  <text class="panel-title" x="32" y="498">LEGEND</text>
  <rect x="32" y="508" width="18" height="18" rx="3" fill="#1d4ed8"/>
  <text class="legend" x="58" y="521">detected and enforced</text>
  <rect x="212" y="508" width="18" height="18" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="221" cy="517" r="3.5" fill="#1d4ed8"/>
  <text class="legend" x="238" y="521">detected after the fact</text>
  <rect x="392" y="508" width="18" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="legend" x="418" y="521">no coverage, documented gap</text>

  <rect x="612" y="96" width="476" height="392" rx="5" fill="#ffffff" stroke="#fca5a5"/>
  <text class="panel-title" x="630" y="120" fill="#b91c1c">DOCUMENTED GAPS</text>
  <text class="gap-name" x="630" y="146">openat2</text>
  <text class="gap-note" x="630" y="161">sys_enter_openat2 is a separate tracepoint and is not hooked.</text>
  <text class="gap-note" x="630" y="175">fix: add the program to xsypher.bpf.c</text>
  <text class="gap-name" x="630" y="208">IPv6 IMDS</text>
  <text class="gap-note" x="630" y="223">fd00:ec2::254 is matched by rule, not denied in the hook.</text>
  <text class="gap-note" x="630" y="237">fix: extend lsm/socket_connect to AF_INET6</text>
  <text class="gap-name" x="630" y="270">arbitrary C2 port</text>
  <text class="gap-note" x="630" y="285">the port list is a blocklist; any other port is invisible.</text>
  <text class="gap-note" x="630" y="299">fix: needs behaviour scoring, not a port list</text>
  <text class="gap-name" x="630" y="332">core_pattern</text>
  <text class="gap-note" x="630" y="347">the write is captured by the openat filter but no rule reads it.</text>
  <text class="gap-note" x="630" y="361">fix: one rule over the existing event</text>
  <line x1="630" y1="398" x2="1072" y2="398" stroke="#f1f5f9" stroke-width="1"/>
  <text class="gap-note" x="630" y="418">Coverage is stated per technique, not per rule, because a rule that never</text>
  <text class="gap-note" x="630" y="432">fires on real traffic is worse than no rule: it inflates confidence.</text>
  <text class="gap-note" x="630" y="452">Every claim here is exercised by tests/test_lineage_and_rules.py, which</text>
  <text class="gap-note" x="630" y="466">asserts both a positive and a negative case for each shipped rule.</text>

  <text class="footnote" x="32" y="552">Kernel capture and rule conditions differ deliberately: the openat filter is narrow to bound volume, and a technique that never reaches the ring buffer cannot be detected by any rule.</text>
</svg>
