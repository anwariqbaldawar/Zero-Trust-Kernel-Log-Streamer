      .doc-sub { font-size: 11px; fill: #64748b; }
      .row-label { font-size: 10.5px; fill: #334155; }
      .row-label-gap { font-size: 10.5px; fill: #b91c1c; }
      .col-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 8px; font-weight: 700; fill: #64748b; }
      .legend { font-size: 10px; fill: #475569; }
      .panel-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .gap-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #b91c1c; }
      .gap-note { font-size: 9px; fill: #64748b; }
      .footnote { font-size: 9.5px; fill: #64748b; }
    ]]></style>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>

  <text class="doc-title" x="32" y="34">Detection coverage matrix</text>
  <text class="doc-sub" x="32" y="52">Ten techniques an MCP compromise produces, against the six shipped rules. Gaps are listed with the exact source change that closes each one.</text>

