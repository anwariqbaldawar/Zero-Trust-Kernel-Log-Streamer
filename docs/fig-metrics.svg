<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="Metrics view: four headline counters, a rule evaluation latency histogram with p50, p95 and p99 markers, and an enforcement panel showing kernel denials, delivered mitigations and failed commands">
  <title>Prometheus metrics and enforcement counters</title>
  <desc>Four headline figures from a simulation run, a latency distribution for rule evaluation with percentile markers, and the enforcement counters that distinguish a sensor which is watching from one which is enforcing.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .doc-title { font-size: 15px; font-weight: 600; }
      .doc-sub { font-size: 11px; fill: #64748b; }
      .kpi-label { font-size: 10px; font-weight: 700; letter-spacing: 1.1px; fill: #64748b; }
      .kpi-value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .kpi-unit { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #64748b; }
      .kpi-note { font-size: 10px; fill: #94a3b8; }
      .panel-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .axis { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; fill: #94a3b8; }
      .pct-label { font-size: 9.5px; font-weight: 600; }
      .row-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #334155; }
      .row-value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .row-note { font-size: 9.5px; fill: #94a3b8; }
      .footnote { font-size: 10.5px; fill: #64748b; }
    ]]></style>
  </defs>

  <rect width="1120" height="430" fill="#ffffff"/>

  <text class="doc-title" x="32" y="34">Metrics after the end-to-end run</text>
  <text class="doc-sub" x="32" y="52">Text format on :9109/metrics, no third-party dependency. Values from tests/simulate_mcp_attack.py, 10,016 events.</text>

  <rect x="32" y="72" width="244" height="96" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="kpi-label" x="48" y="94">EVENTS PROCESSED</text>
  <text class="kpi-value" x="48" y="128">10,016</text>
  <text class="kpi-unit" x="141" y="128">in 0.28 s</text>
  <text class="kpi-note" x="48" y="150">37,057 events/s end to end</text>
  <rect x="284" y="72" width="244" height="96" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="kpi-label" x="300" y="94">RULE EVAL p99</text>
  <text class="kpi-value" x="300" y="128">17.3</text>
  <text class="kpi-unit" x="364" y="128">us</text>
  <text class="kpi-note" x="300" y="150">budget 500 us per event</text>
  <rect x="536" y="72" width="244" height="96" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="kpi-label" x="552" y="94">ALERTS RAISED</text>
  <text class="kpi-value" x="552" y="128">8</text>
  <text class="kpi-unit" x="572" y="128">records</text>
  <text class="kpi-note" x="552" y="150">6 rules, 5 attack chains</text>
  <rect x="788" y="72" width="244" height="96" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="kpi-label" x="804" y="94">FRAMES DROPPED</text>
  <text class="kpi-value" x="804" y="128">0</text>
  <text class="kpi-unit" x="824" y="128">frames</text>
  <text class="kpi-note" x="804" y="150">ring buffer and socket</text>

  <rect x="32" y="188" width="668" height="192" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="panel-title" x="50" y="212">RULE EVALUATION LATENCY &#183; microseconds</text>
  <rect x="72.0" y="320.0" width="49.4" height="24.0" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="96.7" y="315.0" text-anchor="middle" fill="#1e40af">8%</text>
  <text class="axis" x="96.7" y="357.0" text-anchor="middle">0-4</text>
  <rect x="133.4" y="260.0" width="49.4" height="84.0" rx="2" fill="#bfdbfe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="158.1" y="255.0" text-anchor="middle" fill="#1e40af">28%</text>
  <text class="axis" x="158.1" y="357.0" text-anchor="middle">4-6</text>
  <rect x="194.8" y="248.0" width="49.4" height="96.0" rx="2" fill="#bfdbfe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="219.5" y="243.0" text-anchor="middle" fill="#1e40af">32%</text>
  <text class="axis" x="219.5" y="357.0" text-anchor="middle">6-8</text>
  <rect x="256.2" y="296.0" width="49.4" height="48.0" rx="2" fill="#bfdbfe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="280.9" y="291.0" text-anchor="middle" fill="#1e40af">16%</text>
  <text class="axis" x="280.9" y="357.0" text-anchor="middle">8-10</text>
  <rect x="317.6" y="320.0" width="49.4" height="24.0" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="342.3" y="315.0" text-anchor="middle" fill="#1e40af">8%</text>
  <text class="axis" x="342.3" y="357.0" text-anchor="middle">10-12</text>
  <rect x="379.0" y="332.0" width="49.4" height="12.0" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="403.7" y="327.0" text-anchor="middle" fill="#1e40af">4%</text>
  <text class="axis" x="403.7" y="357.0" text-anchor="middle">12-14</text>
  <rect x="440.4" y="338.0" width="49.4" height="6.0" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="465.1" y="333.0" text-anchor="middle" fill="#1e40af">2%</text>
  <text class="axis" x="465.1" y="357.0" text-anchor="middle">14-16</text>
  <rect x="501.8" y="340.4" width="49.4" height="3.6" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="526.5" y="335.4" text-anchor="middle" fill="#1e40af">1.2%</text>
  <text class="axis" x="526.5" y="357.0" text-anchor="middle">16-18</text>
  <rect x="563.2" y="342.2" width="49.4" height="1.8" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="587.9" y="337.2" text-anchor="middle" fill="#1e40af">0.6%</text>
  <text class="axis" x="587.9" y="357.0" text-anchor="middle">18-20</text>
  <rect x="624.6" y="343.4" width="49.4" height="0.6" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
  <text class="pct-label" x="649.3" y="338.4" text-anchor="middle" fill="#1e40af">0.2%</text>
  <text class="axis" x="649.3" y="357.0" text-anchor="middle">20+</text>
  <line x1="66" y1="344" x2="680" y2="344" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="256.3" y1="240" x2="256.3" y2="344" stroke="#b45309" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="pct-label" x="260.3" y="234" fill="#b45309">p50 6.2</text>
  <line x1="425.2" y1="240" x2="425.2" y2="344" stroke="#b45309" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="pct-label" x="429.2" y="234" fill="#b45309">p95 11.7</text>
  <line x1="597.1" y1="240" x2="597.1" y2="344" stroke="#b45309" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="pct-label" x="601.1" y="234" fill="#b45309">p99 17.3</text>

  <rect x="716" y="188" width="372" height="192" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="panel-title" x="734" y="212">ENFORCEMENT</text>
  <circle cx="741" cy="233" r="3" fill="#b91c1c"/>
  <text class="row-name" x="754" y="236">xsypher_lsm_blocks_seen</text>
  <text class="row-value" x="1056" y="236" text-anchor="end">7</text>
  <text class="row-note" x="754" y="248">kernel denials, proves hooks are live</text>
  <circle cx="741" cy="261" r="3" fill="#15803d"/>
  <text class="row-name" x="754" y="264">xsypher_mitigations_total</text>
  <text class="row-value" x="1056" y="264" text-anchor="end">8</text>
  <text class="row-note" x="754" y="276">policy commands delivered</text>
  <circle cx="741" cy="289" r="3" fill="#15803d"/>
  <text class="row-name" x="754" y="292">xsypher_commands_failed_total</text>
  <text class="row-value" x="1056" y="292" text-anchor="end">0</text>
  <text class="row-note" x="754" y="304">policy channel health</text>
  <circle cx="741" cy="317" r="3" fill="#15803d"/>
  <text class="row-name" x="754" y="320">xsypher_socket_reconnects_total</text>
  <text class="row-value" x="1056" y="320" text-anchor="end">0</text>
  <text class="row-note" x="754" y="332">collector availability</text>
  <circle cx="741" cy="345" r="3" fill="#0369a1"/>
  <text class="row-name" x="754" y="348">xsypher_active_tracked_processes</text>
  <text class="row-value" x="1056" y="348" text-anchor="end">1,043</text>
  <text class="row-note" x="754" y="360">lineage graph occupancy</text>

  <text class="footnote" x="32" y="404">The two rows that matter operationally are the denial counter and the failed-command counter: together they distinguish a sensor that is merely watching from one that is enforcing.</text>
</svg>
