<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 150" width="1180" height="150" role="img" aria-label="Verified performance envelope: rule evaluation p99 17.3 microseconds against a 500 microsecond budget, 136k events per second in-process, 38k events per second end-to-end, 59 tests passing">
  <title>Verified performance envelope</title>
  <desc>Four animated gauges showing the measured numbers from the verification run and the engineering budget they are compared against.</desc>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="barGood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="mglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      text { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .k { font-size: 10px; font-weight: 700; letter-spacing: 2.2px; fill: #64748b; }
      .v { font-size: 25px; font-weight: 800; fill: #e2e8f0; }
      .u { font-size: 11.5px; fill: #64748b; }
      .b { font-size: 10px; fill: #475569; }
      .fill { transform-box: fill-box; transform-origin: left center; animation: grow 1.8s cubic-bezier(.2,.8,.2,1) forwards; }
      .f1 { animation-delay: .1s; } .f2 { animation-delay: .25s; }
      .f3 { animation-delay: .4s; } .f4 { animation-delay: .55s; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .dot { animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fill { transform: scaleX(1); } }
    ]]></style>
  </defs>

  <rect width="1180" height="150" rx="12" fill="url(#mbg)"/>
  <rect x="0.5" y="0.5" width="1179" height="149" rx="12" fill="none" stroke="#16233a"/>

  <!-- tile 1 -->
  <g transform="translate(24 26)">
    <text class="k" x="0" y="0">RULE EVAL · P99</text>
    <text class="v" x="0" y="30">17.3</text><text class="u" x="70" y="30">µs</text>
    <rect x="0" y="44" width="248" height="6" rx="3" fill="#111c2e"/>
    <rect class="fill f1" x="0" y="44" width="9" height="6" rx="3" fill="url(#barGood)" filter="url(#mglow)"/>
    <text class="b mono" x="0" y="66">budget 500 µs · 3.5% used</text>
  </g>
  <line x1="296" y1="24" x2="296" y2="126" stroke="#16233a"/>

  <!-- tile 2 -->
  <g transform="translate(320 26)">
    <text class="k" x="0" y="0">THROUGHPUT · IN-PROCESS</text>
    <text class="v" x="0" y="30">136k</text><text class="u" x="78" y="30">events/s</text>
    <rect x="0" y="44" width="248" height="6" rx="3" fill="#111c2e"/>
    <rect class="fill f2" x="0" y="44" width="248" height="6" rx="3" fill="url(#barViolet)" filter="url(#mglow)"/>
    <text class="b mono" x="0" y="66">1 core · CPython 3.11 · 2 vCPU sandbox</text>
  </g>
  <line x1="592" y1="24" x2="592" y2="126" stroke="#16233a"/>

  <!-- tile 3 -->
  <g transform="translate(616 26)">
    <text class="k" x="0" y="0">END-TO-END · STREAM</text>
    <text class="v" x="0" y="30">38k</text><text class="u" x="62" y="30">events/s</text>
    <rect x="0" y="44" width="248" height="6" rx="3" fill="#111c2e"/>
    <rect class="fill f3" x="0" y="44" width="112" height="6" rx="3" fill="url(#barGood)" filter="url(#mglow)"/>
    <text class="b mono" x="0" y="66">incl. 720 B frames + JSONL audit</text>
  </g>
  <line x1="888" y1="24" x2="888" y2="126" stroke="#16233a"/>

  <!-- tile 4 -->
  <g transform="translate(912 26)">
    <text class="k" x="0" y="0">VERIFICATION</text>
    <text class="v" x="0" y="30">59</text><text class="u" x="46" y="30">tests · 31 subtests</text>
    <g class="mono">
      <circle class="dot" cx="3" cy="52" r="3.5" fill="#34d399"/>
      <text class="b" x="14" y="55">ABI 640 / 720 / 32 bytes · C == Python</text>
      <circle class="dot" cx="3" cy="70" r="3.5" fill="#34d399"/>
      <text class="b" x="14" y="73">5/5 attack chains contained end-to-end</text>
      <circle class="dot" cx="3" cy="88" r="3.5" fill="#34d399"/>
      <text class="b" x="14" y="91">SHA-256 audit chain verified</text>
    </g>
  </g>
</svg>
