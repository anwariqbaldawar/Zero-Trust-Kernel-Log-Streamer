<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-label="xSypher-Stream data flow diagram: eBPF programs in the kernel write 640-byte records to a 16 MiB ring buffer, the C++20 collector forwards 720-byte frames over AF_UNIX SOCK_SEQPACKET to the Python engine, which returns 32-byte policy commands that the collector applies to the BPF maps">
  <title>xSypher-Stream data flow</title>
  <desc>Three components: eBPF CO-RE programs in the kernel, a libbpf collector in user space, and a Python policy engine. Telemetry flows left to right through the ring buffer and the Unix socket; policy commands flow right to left into the BPF maps.</desc>
  <defs>
    <marker id="arw-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0369a1"/>
    </marker>
    <marker id="arw-policy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
    <style><![CDATA[
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: #0f172a;
      }
      .doc-title { font-size: 15px; font-weight: 600; }
      .doc-sub { font-size: 11px; fill: #64748b; }
      .panel-label { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .panel-title { font-size: 12.5px; font-weight: 600; }
      .panel-file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #64748b; }
      .box-title { font-size: 11.5px; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #334155; }
      .mono-small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; fill: #475569; }
      .label-telemetry { font-size: 9.5px; fill: #0369a1; font-weight: 600; }
      .label-policy { font-size: 9.5px; fill: #b45309; font-weight: 600; }
      .deny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; fill: #b91c1c; font-weight: 600; }
      .footnote { font-size: 10px; fill: #64748b; }
      .legend { font-size: 10px; fill: #475569; }
    ]]></style>
  </defs>

  <rect width="1120" height="440" fill="#ffffff"/>

  <!-- document header -->
  <text class="doc-title" x="32" y="34">xSypher-Stream: component and data flow</text>
  <text class="doc-sub" x="32" y="52">Telemetry (left to right) and policy (right to left). Kernel never blocks on the collector or the engine.</text>

  <!-- legend -->
  <line x1="806" y1="30" x2="836" y2="30" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arw-telemetry)"/>
  <text class="legend" x="844" y="33">telemetry</text>
  <line x1="806" y1="48" x2="836" y2="48" stroke="#b45309" stroke-width="1.6" marker-end="url(#arw-policy)"/>
  <text class="legend" x="844" y="51">policy command</text>
  <line x1="32" y1="68" x2="1088" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============================ panel 1: kernel ============================ -->
  <rect x="32" y="88" width="324" height="304" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="panel-label" x="50" y="112">KERNEL</text>
  <text class="panel-title" x="50" y="130">eBPF CO-RE</text>
  <text class="panel-file" x="132" y="130">src/bpf/xsypher.bpf.c</text>

  <rect x="50" y="142" width="288" height="94" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="62" y="160">Tracepoints</text>
  <text class="mono" x="62" y="178">sys_enter_execve</text>
  <text class="mono" x="62" y="194">sys_enter_connect</text>
  <text class="mono" x="62" y="210">sys_enter_openat</text>
  <text class="mono" x="62" y="226">sys_enter_memfd_create, sched_process_exit</text>

  <rect x="50" y="248" width="288" height="62" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="62" y="266">BPF LSM hooks</text>
  <text class="deny" x="288" y="266" text-anchor="end">return -EPERM</text>
  <text class="mono" x="62" y="282">bprm_check_security</text>
  <text class="mono" x="62" y="298">socket_connect, file_open</text>

  <rect x="50" y="322" width="288" height="54" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="62" y="340">Maps</text>
  <text class="mono-small" x="62" y="354">events_ringbuf (16 MiB) · quarantined_*</text>
  <text class="mono-small" x="62" y="367">blocked_ipv4 · config · metrics</text>

  <!-- ========================== panel 2: collector =========================== -->
  <rect x="396" y="88" width="324" height="304" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="panel-label" x="414" y="112">USER SPACE</text>
  <text class="panel-title" x="414" y="130">libbpf collector</text>
  <text class="panel-file" x="510" y="130">src/collector (C++20)</text>

  <rect x="414" y="142" width="288" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="426" y="160">ring_buffer__poll()</text>
  <text class="mono-small" x="426" y="176">epoll reactor, zero-copy records</text>

  <rect x="414" y="206" width="288" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="426" y="224">Container ID resolver</text>
  <text class="mono-small" x="426" y="240">/proc/&lt;pid&gt;/cgroup, LRU cache with TTL</text>

  <rect x="414" y="270" width="288" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="426" y="288">AF_UNIX server</text>
  <text class="mono-small" x="426" y="304">SOCK_SEQPACKET, broadcast + intake</text>

  <rect x="414" y="334" width="288" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="426" y="352">Policy applier</text>
  <text class="mono-small" x="426" y="368">bpf_map_update_elem()</text>

  <!-- =========================== panel 3: engine ============================= -->
  <rect x="760" y="88" width="328" height="304" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="panel-label" x="778" y="112">POLICY</text>
  <text class="panel-title" x="778" y="130">Engine</text>
  <text class="panel-file" x="838" y="130">src/engine (Python 3.12)</text>

  <rect x="778" y="142" width="292" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="790" y="160">Frame decoder</text>
  <text class="mono-small" x="790" y="176">720 B, magic and version checked</text>

  <rect x="778" y="206" width="292" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="790" y="224">Lineage graph</text>
  <text class="mono-small" x="790" y="240">ancestry chains, 5 s grace, bounded</text>

  <rect x="778" y="270" width="292" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="790" y="288">Rule engine</text>
  <text class="mono-small" x="790" y="304">declarative YAML, p99 ~17 µs</text>

  <rect x="778" y="334" width="292" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="box-title" x="790" y="352">Mitigator</text>
  <text class="mono-small" x="790" y="368">quarantine, block, kill, audit log</text>

  <!-- ============================== flows =================================== -->
  <!-- telemetry: kernel -> collector -->
  <line x1="358" y1="182" x2="392" y2="182" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arw-telemetry)"/>
  <text class="label-telemetry" x="375" y="174" text-anchor="middle">640 B</text>

  <!-- telemetry: collector -> engine -->
  <line x1="722" y1="182" x2="756" y2="182" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arw-telemetry)"/>
  <text class="label-telemetry" x="739" y="174" text-anchor="middle">720 B</text>

  <!-- policy: engine -> collector -->
  <line x1="756" y1="355" x2="722" y2="355" stroke="#b45309" stroke-width="1.6" marker-end="url(#arw-policy)"/>
  <text class="label-policy" x="739" y="375" text-anchor="middle">32 B</text>

  <!-- policy: collector -> kernel -->
  <line x1="392" y1="355" x2="358" y2="355" stroke="#b45309" stroke-width="1.6" marker-end="url(#arw-policy)"/>
  <text class="label-policy" x="375" y="375" text-anchor="middle">map</text>

  <!-- footnote -->
  <line x1="32" y1="408" x2="1088" y2="408" stroke="#e2e8f0" stroke-width="1"/>
  <text class="footnote" x="32" y="426">Wire format: little-endian, magic 0x58535950, ABI v2. Telemetry frame: struct wire_event_msg_t (720 B). Policy frame: struct wire_policy_cmd_t (32 B). Ring buffer: BPF_MAP_TYPE_RINGBUF, 16 MiB.</text>
</svg>
