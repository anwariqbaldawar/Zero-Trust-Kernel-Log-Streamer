# SPDX-License-Identifier: Apache-2.0
#
# Two containers, one host:
#   collector : privileged eBPF sidecar that owns the ring buffer and the
#               AF_UNIX/SOCK_SEQPACKET socket
#   engine    : unprivileged Python threat engine that reads telemetry and
#               writes quarantine commands back over the same socket
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Prerequisites on the host: kernel >= 5.10, CONFIG_BPF_LSM=y and `lsm=bpf` in
# the kernel command line for inline enforcement (telemetry works without it).

name: xsypher-stream

x-common: &common
  image: xsypher-stream:2.0.0
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  volumes:
    - xsypher-run:/run/xsypher

services:
  collector:
    <<: *common
    container_name: xsypher-collector
    # The collector must see the host kernel's BTF and every process/cgroup.
    pid: host
    network_mode: host
    privileged: true
    command:
      - "--socket-path"
      - "/run/xsypher/stream.sock"
      - "--block-imds"
      - "--enforce"
    volumes:
      - xsypher-run:/run/xsypher
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/xsypher/stream.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  engine:
    <<: *common
    container_name: xsypher-engine
    depends_on:
      collector:
        condition: service_healthy
    # The engine only needs the socket plus a place to write the audit log.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # --active-kill requires visibility of host PIDs; drop it if the engine
    # runs without pid: host (the kernel LSM quarantine still applies).
    pid: host
    command:
      - "python3"
      - "-m"
      - "engine.main"
      - "--socket-path"
      - "/run/xsypher/stream.sock"
      - "--rules"
      - "/etc/xsypher/rules.yaml"
      - "--alert-log"
      - "/var/log/xsypher-alerts.jsonl"
      - "--metrics-port"
      - "9109"
      - "--enforce-kernel"
      - "--no-color"
    ports:
      - "9109:9109"
    volumes:
      - xsypher-run:/run/xsypher
      - xsypher-alerts:/var/log
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:9109/healthz\",timeout=2)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  xsypher-run:
    driver: local
  xsypher-alerts:
    driver: local
