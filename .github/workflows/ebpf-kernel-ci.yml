name: Real BPF LSM kernel verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native and QEMU tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm cmake libbpf-dev libelf-dev zlib1g-dev linux-tools-common linux-tools-generic qemu-system-x86 virtme flex bison bc libssl-dev libncurses-dev
      - name: Build Linux 6.12 with BPF LSM enabled
        run: |
          git clone --depth 1 --branch v6.12 https://github.com/torvalds/linux.git "$RUNNER_TEMP/linux"
          cd "$RUNNER_TEMP/linux"
          make defconfig
          scripts/config --enable BPF --enable BPF_SYSCALL --enable BPF_JIT --enable BPF_EVENTS --enable BPF_LSM --enable SECURITY --enable DEBUG_INFO --enable DEBUG_INFO_BTF --disable DEBUG_INFO_NONE --disable DEBUG_INFO_REDUCED --enable FTRACE --enable FTRACE_SYSCALLS
          make olddefconfig
          sudo apt-get install -y dwarves
          make -j"$(nproc)" bzImage
      - name: Load and attach every program in QEMU (no simulation or fallback)
        run: |
          sudo virtme-run --kimg "$RUNNER_TEMP/linux/arch/x86/boot/bzImage" --mods=none --rw --pwd --memory 2G --append 'lsm=lockdown,capability,yama,bpf' --script-sh 'bash scripts/kernel_ci.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-verifier-log
          path: kernel-verifier.log
          if-no-files-found: warn
